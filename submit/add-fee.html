<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>চাঁদা সংগ্রহ - Bagore High School</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{ --maroon:#6b1032; --maroon-dark:#3d0a1c; --maroon-soft:#8a1c42; --gold:#c9a227; --gold-light:#ecd48a; --cream:#f7ecd8; --paper:#fffaf0; --ink:#2a1810; --muted:#8a7566; --muted-light:#b7a58f; --success:#166534; --success-bg:#dcfce7; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Hind Siliguri', sans-serif; background:var(--cream); color:var(--ink); line-height:1.6; }
  
  /* Header */
  .hero-section{ position:relative; background: radial-gradient(ellipse at 50% -20%, rgba(236,212,138,0.35), transparent 60%), linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%); color:var(--paper); padding:56px 20px 40px; text-align:center; overflow:hidden; }
  .header-content{ position:relative; z-index:1; }
  .hero-section h1{ font-family:'Playfair Display', serif; font-weight:800; font-size:clamp(24px, 4vw, 36px); margin-bottom:10px; }
  
  /* Container & Form Card */
  .container{ max-width:600px; margin: -20px auto 40px; padding:0 20px; position:relative; z-index:10; }
  .form-card{ background:var(--paper); padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(61,10,28,0.1); border:1px solid rgba(236,212,138,0.4); }
  
  .form-title{ text-align:center; font-family:'Playfair Display', serif; color:var(--maroon-dark); font-size:22px; margin-bottom:20px; border-bottom:2px dashed var(--gold-light); padding-bottom:10px; }
  
  /* Input Groups */
  .input-group{ margin-bottom:20px; }
  .input-group label{ display:block; font-weight:600; color:var(--maroon-dark); margin-bottom:8px; font-size:15px; }
  .input-group input{ width:100%; padding:14px; border:1.5px solid var(--muted-light); border-radius:10px; font-family:inherit; font-size:16px; color:var(--ink); background:#fff; transition:0.3s; outline:none; }
  .input-group input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.2); }
  
  /* Quick Amounts */
  .quick-amounts{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .quick-btn{ background:var(--cream); border:1px solid var(--gold-light); color:var(--maroon); padding:8px 16px; border-radius:20px; font-family:inherit; font-weight:600; font-size:14px; cursor:pointer; transition:0.2s; }
  .quick-btn:hover, .quick-btn:active{ background:var(--gold); color:var(--maroon-dark); transform:translateY(-2px); }
  
  /* Submit Button */
  .submit-btn{ width:100%; background:var(--maroon); color:var(--paper); padding:16px; border:none; border-radius:10px; font-family:inherit; font-size:18px; font-weight:700; cursor:pointer; transition:0.3s; margin-top:10px; display:flex; justify-content:center; align-items:center; gap:10px; }
  .submit-btn:hover{ background:var(--maroon-dark); box-shadow:0 6px 15px rgba(107,16,50,0.3); }
  .submit-btn:disabled{ background:var(--muted); cursor:not-allowed; }
  
  /* Messages */
  .message{ margin-top:20px; padding:15px; border-radius:10px; text-align:center; font-weight:600; display:none; }
  .message.success{ background:var(--success-bg); color:var(--success); border:1px solid #bbf7d0; display:block; }
  .message.error{ background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; display:block; }

  /* Navigation Button */
  .nav-btn{ position:absolute; top:20px; left:20px; color:var(--gold-light); text-decoration:none; border:1px solid rgba(236,212,138,0.5); padding:8px 16px; border-radius:20px; font-size:14px; font-weight:600; background:rgba(0,0,0,0.2); backdrop-filter:blur(5px); transition:0.3s; z-index: 10;}
  
    /* ---------- Hamburger Menu Styles ---------- */
  .menu-btn { position:absolute; top:20px; left:20px; color:var(--gold-light); border:1px solid rgba(236,212,138,0.5); padding:8px 14px; border-radius:8px; font-size:20px; background:rgba(0,0,0,0.2); backdrop-filter:blur(5px); cursor:pointer; z-index:10; transition:0.3s; }
  .menu-btn:hover { background:rgba(236,212,138,0.2); }
  
  .side-menu { position:fixed; top:0; left:-300px; width:280px; height:100vh; background:var(--paper); z-index:1000; box-shadow:4px 0 15px rgba(0,0,0,0.2); transition:left 0.3s ease; display:flex; flex-direction:column; }
  .side-menu.active { left:0; }
  
  .menu-header { display:flex; justify-content:space-between; align-items:center; padding:25px 20px; background:var(--maroon); color:var(--gold-light); }
  .menu-header h3 { font-family:'Playfair Display', serif; font-size:22px; margin:0; }
  .close-btn { background:none; border:none; color:var(--gold-light); font-size:22px; cursor:pointer; transition:0.2s; }
  .close-btn:hover { color:white; transform:rotate(90deg); }
  
  .menu-links { padding:20px 0; display:flex; flex-direction:column; gap:5px; }
  .menu-links a { text-decoration:none; color:var(--maroon-dark); padding:14px 25px; font-size:16px; font-weight:600; display:flex; align-items:center; gap:12px; transition:0.2s; border-left:4px solid transparent; }
  .menu-links a:hover { background:var(--cream); border-left:4px solid var(--gold); color:var(--maroon); }
  .menu-links a i { width:20px; text-align:center; color:var(--muted); transition:0.2s; }
  .menu-links a:hover i { color:var(--maroon); }
  
  .menu-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; display:none; opacity:0; transition:opacity 0.3s ease; backdrop-filter:blur(2px); }
  .menu-overlay.active { display:block; opacity:1; }

</style>
</head>
<body>

  <header class="hero-section">
    <!-- থ্রি-লাইন মেনু আইকন ও প্যানেল -->
    <div class="menu-btn" id="menuBtn">
      <i class="fas fa-bars"></i>
    </div>

    <div class="side-menu" id="sideMenu">
      <div class="menu-header">
        <h3>মেনু</h3>
        <button class="close-btn" id="closeBtn"><i class="fas fa-times"></i></button>
      </div>
      <nav class="menu-links">
        <a href="index.html"><i class="fas fa-list"></i> স্টুডেন্ট লিস্ট</a>
        <a href="fees.html"><i class="fas fa-chart-pie"></i> ফিজ ড্যাশবোর্ড</a>
        <a href="add-fee.html"><i class="fas fa-plus-circle"></i> নতুন চাঁদা এন্ট্রি</a>
      </nav>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>
    <!-- মেনু শেষ -->

  </header>

  <main class="container">
    <div class="form-card">
      <h2 class="form-title">স্টুডেন্টের তথ্য দিন</h2>
      
      <form id="feeForm">
        <div class="input-group">
          <label for="studentName"><i class="fas fa-user"></i> স্টুডেন্টের নাম</label>
          <input type="text" id="studentName" placeholder="যেমন: রাহুল দাস" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <label for="studentClass"><i class="fas fa-chalkboard-user"></i> ক্লাস</label>
          <input type="text" id="studentClass" placeholder="যেমন: 10" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <label for="feeAmount"><i class="fas fa-rupee-sign"></i> চাঁদার পরিমাণ</label>
          <input type="number" id="feeAmount" placeholder="অ্যামাউন্ট লিখুন বা নিচে সিলেক্ট করুন" required autocomplete="off">
          
          <div class="quick-amounts">
            <button type="button" class="quick-btn" onclick="setAmount(5)">₹৫</button>
            <button type="button" class="quick-btn" onclick="setAmount(10)">₹১০</button>
            <button type="button" class="quick-btn" onclick="setAmount(15)">₹১৫</button>
            <button type="button" class="quick-btn" onclick="setAmount(20)">₹২০</button>
            <button type="button" class="quick-btn" onclick="setAmount(50)">₹৫০</button>
          </div>
        </div>
        
        <button type="submit" class="submit-btn" id="submitBtn">
          <span>সেভ করুন</span> <i class="fas fa-paper-plane"></i>
        </button>
      </form>

      <div id="statusMessage" class="message"></div>
    </div>
  </main>

  <script>
  
    if(sessionStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
  }

    // আপনার *নতুন* Web App URL-টি এখানে বসান (Deployment আপডেট করার পর যেটা পাবেন)
    const API_URL = 'https://script.google.com/macros/s/AKfycbwO7YT8Pclz2uhDkfCg3F8QsJ6mDVJkt3fenQxR0542gQ3mUNHFYh9aurTXQhQNsljNJQ/exec';

    // কুইক অ্যামাউন্ট বাটনের কাজ
    function setAmount(amount) {
      document.getElementById('feeAmount').value = amount;
    }

    // ফর্ম সাবমিট হ্যান্ডলার
    document.getElementById('feeForm').addEventListener('submit', async function(e) {
      e.preventDefault(); // পেজ রিলোড বন্ধ করা
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      
      const name = document.getElementById('studentName').value.trim();
      const studentClass = document.getElementById('studentClass').value.trim();
      const amount = document.getElementById('feeAmount').value.trim();

      // লোডিং স্টেট
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>সেভ হচ্ছে...</span> <i class="fas fa-spinner fa-spin"></i>';
      statusMessage.className = 'message';
      statusMessage.innerHTML = '';

            try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'add_fee', Name: name, Class: studentClass, Amount: amount })
        });

        
        const result = await response.json();
        
        if (result.success) {
          statusMessage.className = 'message success';
          statusMessage.innerHTML = '<i class="fas fa-check-circle"></i> সফলভাবে গুগোল শিটে যুক্ত হয়েছে!';
          document.getElementById('feeForm').reset(); // ফর্ম ক্লিয়ার করা
        } else {
          throw new Error(result.error || "অজানা সমস্যা হয়েছে");
        }
      } catch (error) {
        statusMessage.className = 'message error';
        statusMessage.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + error.message;
      } finally {
        // বাটন আগের অবস্থায় ফিরিয়ে আনা
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>সেভ করুন</span> <i class="fas fa-paper-plane"></i>';
        
        // ৩ সেকেন্ড পর মেসেজ লুকিয়ে ফেলা
        setTimeout(() => {
          statusMessage.className = 'message';
        }, 3000);
      }
    });
    
        // --- মেনু খোলার এবং বন্ধ করার লজিক ---
    document.addEventListener('DOMContentLoaded', () => {
      const menuBtn = document.getElementById('menuBtn');
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      if(menuBtn && closeBtn && sideMenu && menuOverlay) {
        function toggleMenu() {
          sideMenu.classList.toggle('active');
          if(sideMenu.classList.contains('active')) {
            menuOverlay.style.display = 'block';
            setTimeout(() => menuOverlay.classList.add('active'), 10);
          } else {
            menuOverlay.classList.remove('active');
            setTimeout(() => menuOverlay.style.display = 'none', 300);
          }
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);
      }
    });

  </script>
</body>
</html>
