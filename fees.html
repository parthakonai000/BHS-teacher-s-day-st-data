<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bagore High School — Fees Collection Dashboard</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{ --maroon:#6b1032; --maroon-dark:#3d0a1c; --maroon-soft:#8a1c42; --gold:#c9a227; --gold-light:#ecd48a; --cream:#f7ecd8; --paper:#fffaf0; --ink:#2a1810; --muted:#8a7566; --muted-light:#b7a58f; --success:#166534; --success-bg:#dcfce7; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Hind Siliguri', sans-serif; background:var(--cream); color:var(--ink); line-height:1.6; }
  
  /* Header Setup */
  .hero-section{ position:relative; background: radial-gradient(ellipse at 50% -20%, rgba(236,212,138,0.35), transparent 60%), linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%); color:var(--paper); padding:56px 20px 40px; text-align:center; overflow:hidden; }
  .header-content{ position:relative; z-index:1; }
  .header-eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-light); background:rgba(255,255,255,0.08); border:1px solid rgba(236,212,138,0.4); padding:6px 14px; border-radius:999px; margin-bottom:16px; }
  .hero-section h1{ font-family:'Playfair Display', serif; font-weight:800; font-size:clamp(28px, 4vw, 40px); margin-bottom:10px; text-shadow:0 2px 12px rgba(0,0,0,0.25); }
  .hero-section p.tagline{ font-size:17px; color:var(--gold-light); opacity:0.95; }
  .container{ max-width:1100px; margin:0 auto; padding:32px 20px 60px; }
  
  /* Menu Styles */
  .menu-btn { position:absolute; top:20px; left:20px; color:var(--gold-light); border:1px solid rgba(236,212,138,0.5); padding:8px 14px; border-radius:8px; font-size:20px; background:rgba(0,0,0,0.2); backdrop-filter:blur(5px); cursor:pointer; z-index:10; transition:0.3s; }
  .menu-btn:hover { background:rgba(236,212,138,0.2); }
  .side-menu { position:fixed; top:0; left:-300px; width:280px; height:100vh; background:var(--paper); z-index:1000; box-shadow:4px 0 15px rgba(0,0,0,0.2); transition:left 0.3s ease; display:flex; flex-direction:column; }
  .side-menu.active { left:0; }
  .menu-header { display:flex; justify-content:space-between; align-items:center; padding:25px 20px; background:var(--maroon); color:var(--gold-light); }
  .menu-header h3 { font-family:'Playfair Display', serif; font-size:22px; margin:0; }
  .close-btn { background:none; border:none; color:var(--gold-light); font-size:22px; cursor:pointer; transition:0.2s; }
  .close-btn:hover { color:white; transform:rotate(90deg); }
  .menu-links { padding:20px 0; display:flex; flex-direction:column; gap:5px; }
  .menu-links a { text-decoration:none; color:var(--maroon-dark); padding:14px 25px; font-size:16px; font-weight:600; display:flex; align-items:center; gap:12px; transition:0.2s; border-left:4px solid transparent; }
  .menu-links a:hover { background:var(--cream); border-left:4px solid var(--gold); color:var(--maroon); }
  .menu-links a i { width:20px; text-align:center; color:var(--muted); }
  
  .menu-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; display:none; opacity:0; transition:opacity 0.3s ease; backdrop-filter:blur(2px); }
  .menu-overlay.active { display:block; opacity:1; }

  /* Section Titles */
  .section-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--maroon-dark); margin: 30px 0 15px; border-bottom: 2px dashed var(--gold-light); padding-bottom: 5px; }
  .dashboard-wrapper { margin-bottom: 40px; }
  
  /* Total Card */
  .total-card { background: linear-gradient(135deg, var(--maroon), var(--maroon-dark)); padding: 25px 20px; border-radius: 14px; box-shadow: 0 6px 20px rgba(61,10,28,0.15); text-align: center; color: var(--gold-light); margin-bottom: 25px; border: 1px solid rgba(236,212,138,0.3); }
  .total-card h4 { font-size: 18px; margin-bottom: 5px; color: rgba(255,255,255,0.8); }
  .total-card .amt { font-size: 36px; font-weight: 800; color: var(--paper); text-shadow: 0 2px 5px rgba(0,0,0,0.3); }

  /* Class-wise Grid */
  .class-wise-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .class-card { background: var(--paper); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid rgba(107,16,50,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.04); transition: transform 0.2s; }
  .class-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
  .class-card h5 { font-size: 14px; color: var(--muted); margin-bottom: 5px; }
  .class-card .class-amt { font-size: 20px; font-weight: 700; color: var(--maroon); }

  /* Animated Bar Chart (UI/UX) */
  .chart-wrapper { background: var(--paper); border: 1px solid rgba(107,16,50,0.12); border-radius: 14px; padding: 25px 20px 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); margin-bottom: 35px; }
  .chart-container { display: flex; align-items: flex-end; justify-content: space-around; height: 220px; gap: 10px; padding-top: 20px; }
  .bar-group { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 100%; max-width: 60px; position: relative; }
  
  .bar-fill { width: 100%; background: linear-gradient(to top, var(--maroon-dark), var(--maroon)); border-radius: 6px 6px 0 0; height: 0; /* Starts at 0 for animation */ transition: height 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; cursor: pointer; box-shadow: 0 4px 10px rgba(107,16,50,0.2); }
  .bar-fill:hover { background: linear-gradient(to top, var(--maroon), #9c1c4e); }
  
  .bar-amt { position: absolute; top: -25px; font-size: 13px; font-weight: 700; color: var(--maroon-dark); opacity: 0; transition: opacity 0.5s ease 0.8s; white-space: nowrap; }
  .bar-group.animate .bar-amt { opacity: 1; }
  
  .bar-label { margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; }

  /* Date-wise Long List */
  .date-wise-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
  .date-card { background: var(--paper); border: 1px solid rgba(107,16,50,0.12); border-left: 5px solid var(--maroon); padding: 14px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.03); transition: transform 0.2s ease; }
  .date-card:hover { transform: translateX(4px); }
  .date-info { display: flex; align-items: center; gap: 12px; }
  .date-info i { color: var(--maroon); font-size: 18px; }
  .date-label-main { font-weight: 700; font-size: 16px; color: var(--maroon-dark); }
  .date-badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: 600; margin-left: 8px; }
  .badge-today { background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }
  .badge-yesterday { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
  .date-amt { font-size: 18px; font-weight: 700; color: var(--success); background: #f0fdf4; padding: 4px 12px; border-radius: 6px; border: 1px solid #dcfce7; }

  /* Controls (Search & Filter) */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; background: var(--paper); padding: 16px; border-radius: 14px; border: 1px solid rgba(107,16,50,0.12); box-shadow: 0 6px 20px rgba(61,10,28,0.06); }
  .search-box { flex: 2; min-width: 200px; display: flex; align-items: center; background: var(--cream); border: 1px solid rgba(107,16,50,0.15); border-radius: 999px; padding: 0 16px; }
  .search-box i { color: var(--maroon); font-size: 14px; }
  .search-box input { width: 100%; border: none; background: transparent; padding: 12px 10px; font-family: inherit; font-size: 15px; outline: none; color: var(--ink); }
  .filter-box { flex: 1; min-width: 140px; display: flex; align-items: center; background: var(--cream); border: 1px solid rgba(107,16,50,0.15); border-radius: 999px; padding: 0 14px; }
  .filter-box i { color: var(--maroon); font-size: 14px; margin-right: 8px; }
  .filter-box select { width: 100%; border: none; background: transparent; padding: 12px 0; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); outline: none; cursor: pointer; }
  
  /* Cards Grid */
  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:22px; }
  .ticket-card{ position:relative; background:var(--paper); border-radius:14px; box-shadow:0 8px 24px rgba(61,10,28,0.08); transition: transform 0.25s ease; }
  .ticket-card:hover{ transform:translateY(-4px); box-shadow:0 14px 30px rgba(61,10,28,0.14); }
  .ticket-main{ padding:20px 20px 16px; }
  .student-name{ font-family:'Playfair Display', serif; font-size:20px; font-weight:700; color:var(--maroon-dark); margin-bottom:6px; }
  .student-class{ font-size:14px; color:var(--muted); }
  .student-date{ font-size:13px; color:var(--muted-light); margin-top:4px; }
  .ticket-divider{ position:relative; height:0; border-top:2px dashed var(--gold-light); }
  .ticket-stub{ padding:16px 20px; text-align: center; }
  .amount-badge{ display:inline-block; font-size: 22px; font-weight: bold; color: var(--success); background: var(--success-bg); padding: 5px 20px; border-radius: 8px; border: 1px solid #bbf7d0; }
  
  /* --- Professional Skeleton Loading --- */
  .skeleton-wrapper { margin-bottom: 40px; }
  .skeleton { background: linear-gradient(90deg, rgba(236,212,138,0.3) 25%, rgba(236,212,138,0.6) 50%, rgba(236,212,138,0.3) 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite linear; border-radius: 12px; }
  @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk-total { height: 110px; width: 100%; margin-bottom: 25px; border-radius: 14px; }
  .sk-title { height: 30px; width: 200px; margin: 30px 0 15px; border-radius: 6px; }
  .sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
  .sk-card { height: 80px; width: 100%; }
  .sk-chart { height: 260px; width: 100%; margin-bottom: 35px; border-radius: 14px; }
  .sk-list-item { height: 60px; width: 100%; margin-bottom: 12px; }
  .sk-ticket { height: 160px; width: 100%; border-radius: 14px; }

  .hidden { display: none !important; }
  
  /* Footer */
  .site-footer{ position:relative; margin-top:40px; background: radial-gradient(ellipse at 50% 120%, rgba(236,212,138,0.25), transparent 60%), linear-gradient(20deg, var(--maroon-dark) 0%, var(--maroon) 100%); color:var(--paper); padding:38px 20px 26px; text-align:center; }
  .footer-inner{ max-width:420px; margin:0 auto; }
  .footer-photo{ width:76px; height:76px; border-radius:50%; object-fit:cover; border:3px solid var(--gold-light); box-shadow:0 6px 18px rgba(0,0,0,0.3); margin:0 auto 14px; display:block; }
  .footer-name{ font-family:'Playfair Display', serif; font-weight:700; font-size:18px; color:var(--gold-light); margin-bottom:4px; }
  .footer-tag{ font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,243,230,0.65); margin-bottom:18px; }
</style>

  <script>
    // এখানে আপনার Google Apps Script এর Web App URL বসান
    const API_URL = 'https://script.google.com/macros/s/AKfycbwO7YT8Pclz2uhDkfCg3F8QsJ6mDVJkt3fenQxR0542gQ3mUNHFYh9aurTXQhQNsljNJQ/exec?type=fees';

    let allStudentsData = []; 

    document.addEventListener('DOMContentLoaded', () => {
      // Menu Toggle
      const menuBtn = document.getElementById('menuBtn');
      const closeBtn = document.getElementById('closeBtn');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function toggleMenu() {
        sideMenu.classList.toggle('active');
        if(sideMenu.classList.contains('active')) {
          menuOverlay.style.display = 'block';
          setTimeout(() => menuOverlay.classList.add('active'), 10);
        } else {
          menuOverlay.classList.remove('active');
          setTimeout(() => menuOverlay.style.display = 'none', 300);
        }
      }
      menuBtn.addEventListener('click', toggleMenu);
      closeBtn.addEventListener('click', toggleMenu);
      menuOverlay.addEventListener('click', toggleMenu);

      // Fetch Data
      fetchData();
      
      // Events
      document.getElementById('searchInput').addEventListener('input', filterData);
      document.getElementById('classFilter').addEventListener('change', filterData);
    });

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();

        if (result.success && result.data) {
          allStudentsData = result.data;
          
          renderDashboard(allStudentsData);
          renderCards(allStudentsData);
          
          // স্কেলেটন লুকানো এবং আসল ডেটা দেখানো
          document.getElementById('skeletonLoader').classList.add('hidden');
          document.getElementById('dashboardSection').classList.remove('hidden');
          document.getElementById('listTitle').classList.remove('hidden');
          document.getElementById('searchSection').classList.remove('hidden');
          document.getElementById('cards-container').classList.remove('hidden');

          // চার্টের অ্যানিমেশন ট্রিগার করা
          setTimeout(() => {
            const bars = document.querySelectorAll('.bar-group');
            bars.forEach(group => {
              const fill = group.querySelector('.bar-fill');
              const targetHeight = fill.getAttribute('data-height');
              fill.style.height = targetHeight + '%';
              group.classList.add('animate');
            });
          }, 100);
        }
      } catch (error) {
        console.error('Fetch Error:', error);
      }
    }

    // Date Format Helper
    function formatToCleanDate(dateVal) {
      if (!dateVal) return '';
      if (typeof dateVal === 'string' && dateVal.includes('T')) {
        const datePart = dateVal.split('T')[0]; 
        const parts = datePart.split('-');
        if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      const str = String(dateVal).trim();
      const parts = str.split(/[-/]/);
      if (parts.length === 3) {
        let day, month, year;
        if (parts[0].length === 4) {
          year = parts[0]; month = parts[1].padStart(2, '0'); day = parts[2].padStart(2, '0');
        } else {
          day = parts[0].padStart(2, '0'); month = parts[1].padStart(2, '0'); year = parts[2];
        }
        return `${day}-${month}-${year}`;
      }
      return str;
    }

    function parseDateString(dateVal) {
      const cleanStr = formatToCleanDate(dateVal);
      if (!cleanStr) return null;
      const parts = cleanStr.split('-');
      if (parts.length === 3) {
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        return new Date(year, month, day);
      }
      return null;
    }

    function formatDateToKey(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function renderDashboard(data) {
      let totalSum = 0;
      let classTotals = {};
      let dateTotals = {};

      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);

      const todayStr = formatDateToKey(today);
      const yesterdayStr = formatDateToKey(yesterday);

      data.forEach(student => {
        const amount = Number(student.Amount) || 0;
        const className = (student.Class || 'অজানা').toString().trim();
        
        totalSum += amount;
        classTotals[className] = (classTotals[className] || 0) + amount;

        const rawDate = student.Date || student.date;
        if (rawDate) {
          const cleanKey = formatToCleanDate(rawDate);
          if (cleanKey) {
            dateTotals[cleanKey] = (dateTotals[cleanKey] || 0) + amount;
          }
        }
      });

      // সর্বমোট
      document.getElementById('totalAmount').innerText = totalSum.toLocaleString('en-IN');

      // Class Cards Render & Max Value Calculation for Chart
      const classContainer = document.getElementById('classWiseContainer');
      const chartContainer = document.getElementById('classChartContainer');
      classContainer.innerHTML = '';
      chartContainer.innerHTML = '';

      let maxAmount = 0;
      const sortedClasses = Object.keys(classTotals).sort((a, b) => {
        const numA = parseInt(a.replace(/\D/g, ''));
        const numB = parseInt(b.replace(/\D/g, ''));
        if(!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });

      // Find max amount for chart scaling
      sortedClasses.forEach(className => {
        if (classTotals[className] > maxAmount) {
          maxAmount = classTotals[className];
        }
      });

      sortedClasses.forEach(className => {
        const amt = classTotals[className];
        
        // 1. Render Grid Card
        const card = document.createElement('div');
        card.className = 'class-card';
        card.innerHTML = `
          <h5>ক্লাস ${className}</h5>
          <div class="class-amt">₹ ${amt.toLocaleString('en-IN')}</div>
        `;
        classContainer.appendChild(card);

        // 2. Render Chart Bar
        // Minimum 5% height so empty bars still show slightly
        const heightPercent = maxAmount > 0 ? Math.max((amt / maxAmount) * 100, 5) : 0; 
        
        const barGroup = document.createElement('div');
        barGroup.className = 'bar-group';
        barGroup.innerHTML = `
          <div class="bar-amt">₹${amt.toLocaleString('en-IN')}</div>
          <div class="bar-fill" data-height="${heightPercent}"></div>
          <div class="bar-label">Cl-${className}</div>
        `;
        chartContainer.appendChild(barGroup);
      });

      // Date List Render
      const dateContainer = document.getElementById('dateWiseContainer');
      dateContainer.innerHTML = '';

      const sortedDates = Object.keys(dateTotals).sort((a, b) => {
        const da = parseDateString(a) || new Date(0);
        const db = parseDateString(b) || new Date(0);
        return db - da; 
      });

      if (sortedDates.length === 0) {
        dateContainer.innerHTML = '<p style="color:var(--muted); font-size:14px;">কোনো তারিখের ডেটা পাওয়া যায়নি।</p>';
      } else {
        sortedDates.forEach(dateKey => {
          let badgeHTML = '';
          if (dateKey === todayStr) {
            badgeHTML = '<span class="date-badge badge-today">আজ</span>';
          } else if (dateKey === yesterdayStr) {
            badgeHTML = '<span class="date-badge badge-yesterday">গতকাল</span>';
          }

          const card = document.createElement('div');
          card.className = 'date-card';
          card.innerHTML = `
            <div class="date-info">
              <i class="far fa-calendar-check"></i>
              <div>
                <span class="date-label-main">${dateKey}</span>
                ${badgeHTML}
              </div>
            </div>
            <div class="date-amt">₹ ${dateTotals[dateKey].toLocaleString('en-IN')}</div>
          `;
          dateContainer.appendChild(card);
        });
      }
    }

    function renderCards(data) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      
      data.forEach((student) => {
        const name = student.Name || 'অজানা নাম';
        const className = student.Class || '-';
        const amount = Number(student.Amount) || 0;
        const rawDate = student.Date || student.date || '';

        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.innerHTML = `
          <div class="ticket-main">
            <div class="student-name">${name}</div>
            <div class="student-class">ক্লাস: <span>${className}</span></div>
            ${rawDate ? `<div class="student-date"><i class="far fa-clock"></i> ${formatToCleanDate(rawDate)}</div>` : ''}
          </div>
          <div class="ticket-divider"></div>
          <div class="ticket-stub">
            <div class="amount-badge">₹ ${amount.toLocaleString('en-IN')}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterData() {
      const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedClass = document.getElementById('classFilter').value;

      const filteredData = allStudentsData.filter(student => {
        const studentName = (student.Name || '').toLowerCase();
        const studentClass = String(student.Class || '').replace(/\D/g, ''); 

        const matchesName = studentName.includes(searchText);
        const matchesClass = (selectedClass === 'all') || (studentClass === selectedClass);

        return matchesName && matchesClass;
      });

      renderCards(filteredData);
    }
  </script>
</body>
</html>
