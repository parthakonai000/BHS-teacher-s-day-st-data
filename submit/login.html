<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অ্যাডমিন লগইন - Bagore High School</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Hind+Siliguri:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* আপনার আগের CSS-এর মূল অংশগুলো */
  :root{ --maroon:#6b1032; --maroon-dark:#3d0a1c; --gold:#c9a227; --gold-light:#ecd48a; --cream:#f7ecd8; --paper:#fffaf0; --ink:#2a1810; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Hind Siliguri', sans-serif; background:var(--cream); color:var(--ink); height:100vh; display:flex; justify-content:center; align-items:center; }
  
  .login-card{ background:var(--paper); padding:40px 30px; border-radius:16px; box-shadow:0 10px 30px rgba(61,10,28,0.15); border:1px solid rgba(236,212,138,0.4); width:100%; max-width:400px; text-align:center; }
  .login-card h2{ font-family:'Playfair Display', serif; color:var(--maroon-dark); margin-bottom:25px; font-size:24px; }
  
  .input-group{ margin-bottom:20px; text-align:left; }
  .input-group label{ display:block; font-weight:600; color:var(--maroon-dark); margin-bottom:8px; font-size:15px; }
  .input-group input{ width:100%; padding:14px; border:1.5px solid #b7a58f; border-radius:10px; font-size:16px; outline:none; transition:0.3s; }
  .input-group input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,0.2); }
  
  .submit-btn{ width:100%; background:var(--maroon); color:var(--paper); padding:14px; border:none; border-radius:10px; font-size:18px; font-weight:700; cursor:pointer; transition:0.3s; }
  .submit-btn:hover{ background:var(--maroon-dark); }
  .error-msg{ color:#b91c1c; margin-top:15px; font-weight:600; display:none; }
  
  .back-link{ display:inline-block; margin-top:20px; color:var(--maroon); text-decoration:none; font-weight:600; }
</style>
</head>
<body>

  <div class="login-card">
    <h2><i class="fas fa-lock"></i> অ্যাডমিন প্যানেল</h2>
    
    <form id="loginForm">
      <div class="input-group">
        <label><i class="fas fa-user"></i> ইউজারনেম</label>
        <input type="text" id="username" required autocomplete="off">
      </div>
      <div class="input-group">
        <label><i class="fas fa-key"></i> পাসওয়ার্ড</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" class="submit-btn" id="loginBtn">লগইন করুন</button>
    </form>
    
    <div id="errorMsg" class="error-msg"></div>
    <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> ওয়েবসাইটে ফিরে যান</a>
  </div>

  <script>
    // এখানে আপনার নতুন Deployment URL দিন
    const API_URL = 'https://script.google.com/macros/s/AKfycbwO7YT8Pclz2uhDkfCg3F8QsJ6mDVJkt3fenQxR0542gQ3mUNHFYh9aurTXQhQNsljNJQ/exec';

    // যদি আগে থেকেই লগইন করা থাকে, সরাসরি পেজে নিয়ে যাবে
    if(sessionStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'add-fee.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> যাচাই হচ্ছে...';
      btn.disabled = true;
      err.style.display = 'none';

      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: user, password: pass })
        });
        
        const result = await response.json();
        
        if(result.success) {
          sessionStorage.setItem('isLoggedIn', 'true');
          window.location.href = 'add-fee.html';
        } else {
          err.innerText = result.error;
          err.style.display = 'block';
        }
      } catch(e) {
        err.innerText = "নেটওয়ার্ক সমস্যা!";
        err.style.display = 'block';
      } finally {
        btn.innerHTML = 'লগইন করুন';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
